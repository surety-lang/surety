name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install the pinned toolchain and build the binary the extension runs
        run: rustup toolchain install --profile minimal && cargo build -p surety
        working-directory: .
      - run: sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm run compile
      - run: npm run test:grammar
      - run: npm run test:block
      - run: xvfb-run -a npm run test:extension
