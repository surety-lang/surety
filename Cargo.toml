[workspace]
members = [
    "crates/surety-syntax",
    "crates/surety-check",
    "crates/surety-py",
    "crates/surety-graph",
    "crates/surety-lsp",
    "crates/surety",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surety-lang/surety"
homepage = "https://github.com/surety-lang/surety"

[workspace.dependencies]
serde_json = "1"
sha2 = "0.10"
